<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT App</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b1020;
      color: #e5eefb;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(110, 231, 255, 0.12), transparent 20%),
        radial-gradient(circle at 80% 25%, rgba(167, 139, 250, 0.12), transparent 25%),
        #0b1020;
    }

    .app {
      width: 980px;
      max-width: 90vw;
      height: 680px;
      border-radius: 28px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(15, 23, 42, 0.8);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .logo {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      background: linear-gradient(135deg, #6ee7ff, #a78bfa);
      box-shadow: 0 0 18px rgba(110, 231, 255, 0.6);
    }

    .status {
      color: #9aa9c0;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 260px 1fr;
    }

    .sidebar {
      border-right: 1px solid rgba(255,255,255,0.08);
      background: rgba(15, 23, 42, 0.65);
      padding: 18px 14px;
    }

    .chat-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      color: #dfe9ff;
    }

    .chat-item.active {
      background: linear-gradient(135deg, rgba(110, 231, 255, 0.08), rgba(167, 139, 250, 0.08));
      border-color: rgba(110,231,255,0.2);
    }

    .content {
      display: flex;
      flex-direction: column;
      background: rgba(15, 23, 42, 0.6);
    }

    .messages {
      flex: 1;
      padding: 28px 28px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .bubble {
      max-width: 72%;
      padding: 16px 18px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 15px;
    }

    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(96,165,250,0.22), rgba(110,231,255,0.12));
      border: 1px solid rgba(110,231,255,0.18);
    }

    .bubble.ai {
      align-self: flex-start;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .input {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 18px 22px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .box {
      flex: 1;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
      border-radius: 14px;
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      color: #dfe9ff;
    }

    .send {
      width: 120px;
      height: 52px;
      border: none;
      border-radius: 14px;
      color: white;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      box-shadow: 0 10px 24px rgba(96, 165, 250, 0.28);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <span>GPT APP</span>
      </div>
      <div class="status">ONLINE</div>
    </div>

    <div class="main">
      <div class="sidebar">
        <div class="chat-item active">新对话</div>
        <div class="chat-item">工作计划</div>
        <div class="chat-item">代码生成</div>
        <div class="chat-item">产品文案</div>
      </div>

      <div class="content">
        <div class="messages">
          <div class="bubble ai">你好，我是 GPT。启动页已经完成，主窗口正在显示。</div>
          <div class="bubble user">启动动画效果很不错。</div>
          <div class="bubble ai">可以继续加入更多动画，如消息流动、微光、AI 波纹等。</div>
        </div>

        <div class="input">
          <div class="box">输入消息...</div>
          <button class="send">发送</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
